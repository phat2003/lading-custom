root = "."
tmp_dir = "tmp"

[build]
  # Lệnh build: chỉ định rõ thư mục chứa hàm main() là ./cmd/api
  cmd = "go build -o ./tmp/main.exe ./cmd/api"
  
  # Lệnh chạy file sau khi build
  bin = "./tmp/main.exe"
  
  # Các loại file mà air sẽ theo dõi để tự động reload
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  
  # Bỏ qua các thư mục không cần thiết để máy chạy nhẹ hơn
  exclude_dir = ["assets", "tmp", "vendor", "frontend", "docs", "db"]